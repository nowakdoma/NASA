[project]
name = "fieldshift"
version = "0.1.0"
description = "Decision support for crop-rotation strategies with NASA data (Space Apps 2026)"
readme = "AGENTS.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jsonschema==4.23.0",
    "numpy==2.2.1",
    "pandas==2.2.3",
]

[dependency-groups]
dev = [
    "pre-commit==4.0.1",
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "pipeline"]
addopts = "-q"
